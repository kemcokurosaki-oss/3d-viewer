<header class="topbar">
  <div class="brand">
    <span class="brand-mark" id="brandIcon"></span>
    <span class="brand-name">3D Model Capture</span>
  </div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="spacer"></div>
  <button class="topbar-btn on" id="inspectorToggleBtn" title="詳細パネルの表示切替">
    <span class="icon-wrap" id="inspectorToggleIcon" style="display:flex;width:14px;height:14px"></span>
    <span>詳細</span>
  </button>
  <button class="topbar-btn icon-only" id="themeToggleBtn" title="ダークモード切替"></button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-fixed">
      <div class="sidebar-search-box">
        <span class="icon-wrap" id="sidebarSearchIcon"></span>
        <input type="text" id="sidebarSearch" placeholder="工事番号・客先名で絞り込み">
      </div>
      <div class="recent-chips" id="recentMachinesList"></div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-caption">案件 / 機械</div>
      <div id="sidebarStatus">読み込み中...</div>
      <div id="sidebarList"></div>
    </div>
  </aside>

  <section class="parts-pane">
    <div class="parts-head">
      <span class="ttl">パーツ</span>
      <span class="cnt" id="partsCount"></span>
      <span class="spacer"></span>
      <button class="parts-mini-btn icon-only" id="openSharePointHeadBtn" title="SharePointで開く"></button>
    </div>
    <div class="parts-grid" id="partsGrid"></div>
  </section>

  <section class="viewer-pane">
    <div id="previewPlaceholder">左の一覧から工事番号 → 機械名 → パーツを選択してください</div>
    <div id="previewStage">
      <div class="v-badge">
        <span id="previewTitle" class="ell"></span>
        <span class="idx" id="previewIndex"></span>
      </div>
      <div class="v-tools">
        <div class="bg-swatch-group" id="bgSwatchGroup"></div>
        <button class="v-btn icon-only" id="resetViewBtn" title="視点をリセット"></button>
        <button class="v-btn primary" id="fullscreenBtn"></button>
      </div>
      <div class="v-hint" id="viewerHint"></div>
      <div id="previewStatus"><span class="led"></span><span id="previewStatusText"></span></div>
    </div>
  </section>

  <aside class="inspector" id="inspector">
    <div class="insp-head">
      <span class="ttl" id="inspTitle">詳細</span>
      <span class="spacer"></span>
      <button class="insp-icon-btn" id="inspRenameBtn" title="ファイル名を編集"></button>
      <button class="insp-icon-btn" id="inspCloseBtn" title="閉じる"></button>
    </div>
    <div class="insp-meta" id="inspMeta"></div>
    <div class="insp-order">
      <div class="insp-order-head">
        <span class="cap">並び順</span>
        <span class="hint">ドラッグで変更</span>
      </div>
      <div class="insp-order-list" id="inspOrderList"></div>
    </div>
  </aside>
</div>

<script type="module">
import { initViewer } from "./viewer-core.js";
import { fetchProjectMachineTree, fetchMachineFiles, updateThumbnail, updatePartLabel, reorderParts, splatFileTypeFromFileName } from "./viewer-data.js";
import { getMachineFolderWebUrl } from "./sharepoint-client.js";
import { ICON_SUN, ICON_MOON, ICON_SEARCH, ICON_EDIT, ICON_CUBE,
         ICON_EXPAND, ICON_CLOSE, ICON_RESET, ICON_CLOCK, ICON_CHEVRON } from "./icons.js";

/* 追加アイコン（icons.js に無いものだけこの画面でインライン定義する） */
const svg = (inner) => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICON_DOTS = svg('<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>');
const ICON_GRIP = svg('<path d="M9 6h.01"/><path d="M15 6h.01"/><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M9 18h.01"/><path d="M15 18h.01"/>');
const ICON_PANEL = svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>');
const ICON_EXTERNAL = svg('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/>');
const ICON_IMAGE = svg('<rect x="3" y="4" width="18" height="14" rx="2"/><path d="m3 14 5-4 4 3 3-2 6 5"/>');
const ICON_MOUSE = svg('<path d="M8 13V6a2 2 0 0 1 4 0v6"/><path d="M12 6a2 2 0 0 1 4 0v6"/><path d="M16 8a2 2 0 0 1 4 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.5L3.5 13a1.7 1.7 0 0 1 2.8-1.9L8 13"/>');

const $ = (id) => document.getElementById(id);

const sidebarStatus = $("sidebarStatus");
const sidebarList = $("sidebarList");
const sidebarSearchInput = $("sidebarSearch");
const recentMachinesList = $("recentMachinesList");
const crumbs = $("crumbs");
const themeToggleBtn = $("themeToggleBtn");
const inspectorEl = $("inspector");
const inspectorToggleBtn = $("inspectorToggleBtn");

$("brandIcon").innerHTML = ICON_CUBE;
$("sidebarSearchIcon").innerHTML = ICON_SEARCH;
$("inspectorToggleIcon").innerHTML = ICON_PANEL;
$("openSharePointHeadBtn").innerHTML = ICON_EXTERNAL;
$("resetViewBtn").innerHTML = ICON_RESET;
$("fullscreenBtn").innerHTML = `${ICON_EXPAND}<span>全画面</span>`;
$("viewerHint").innerHTML = `${ICON_MOUSE}<span>左ドラッグ 回転 ／ ホイール 拡大縮小</span>`;
$("inspRenameBtn").innerHTML = ICON_EDIT;
$("inspCloseBtn").innerHTML = ICON_CLOSE;

/* ---- ライト/ダークモード切替（localStorageに保存） ---- */
const THEME_KEY = "3dmodel-theme";
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeToggleBtn.innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
  themeToggleBtn.title = theme === "dark" ? "ライトモードに切替" : "ダークモードに切替";
}
applyTheme(localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark");
themeToggleBtn.onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};

/* ---- 詳細パネルの開閉（localStorageに保存） ---- */
const INSP_KEY = "3dmodel-inspector-open";
function applyInspector(open) {
  inspectorEl.classList.toggle("hidden", !open);
  inspectorToggleBtn.classList.toggle("on", open);
}
let inspectorOpen = localStorage.getItem(INSP_KEY) !== "closed";
applyInspector(inspectorOpen);
inspectorToggleBtn.onclick = () => {
  inspectorOpen = !inspectorOpen;
  localStorage.setItem(INSP_KEY, inspectorOpen ? "open" : "closed");
  applyInspector(inspectorOpen);
};
$("inspCloseBtn").onclick = () => inspectorToggleBtn.onclick();

/* ---- 状態 ---- */
const partsGrid = $("partsGrid");
const partsCountEl = $("partsCount");
const previewPlaceholder = $("previewPlaceholder");
const previewStage = $("previewStage");
const previewTitle = $("previewTitle");
const previewIndex = $("previewIndex");
const previewStatusEl = $("previewStatus");
const previewStatusText = $("previewStatusText");
const viewerHint = $("viewerHint");
const inspTitle = $("inspTitle");
const inspMeta = $("inspMeta");
const inspOrderList = $("inspOrderList");

let tree = [];
let expandedNums = new Set();
let currentProject = null;
let currentMachine = null;
let currentFiles = [];
let currentFileId = null;
let currentViewer = null;
let currentUrl = null;
let searchQuery = "";
let selectedBackground = 0x1a1a1a;
let partsLoading = false;
let partsError = "";

function formatDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatShortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
}
/* ---- 検索履歴（localStorageに保存、最大6件） ---- */
const RECENT_KEY = "3dmodel-recent-machines";
function loadRecentMachines() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; }
}
function saveRecentMachine(project, machineName) {
  const recent = loadRecentMachines().filter((r) => !(r.num === project.num && r.machine === machineName));
  recent.unshift({ num: project.num, customer: project.customer, machine: machineName });
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent.slice(0, 6)));
  renderRecentMachines();
}
function renderRecentMachines() {
  const recent = loadRecentMachines().slice(0, 3);
  recentMachinesList.innerHTML = "";
  recent.forEach((r) => {
    const btn = document.createElement("button");
    btn.className = "recent-chip";
    btn.title = `${r.num}　${r.machine}`;
    btn.innerHTML = `${ICON_CLOCK}<span class="recent-label">${r.num}　${r.machine}</span>`;
    btn.onclick = () => {
      const project = tree.find((p) => p.num === r.num);
      if (!project) return;
      expandedNums.add(project.num);
      selectMachine(project, r.machine);
    };
    recentMachinesList.appendChild(btn);
  });
}

/* ---- パンくず ---- */
function renderCrumbs() {
  crumbs.innerHTML = "";
  if (!currentProject) {
    crumbs.innerHTML = `<span>案件を選択してください</span>`;
    return;
  }
  const sep = () => `<span class="sep">${ICON_CHEVRON}</span>`;
  let html = `<span class="num">${currentProject.num}</span>`;
  if (currentProject.customer) html += `${sep()}<span class="ell">${currentProject.customer}</span>`;
  if (currentMachine) {
    html += `${sep()}<span class="cur ell">${currentMachine}</span>`;
    if (!partsLoading) html += `<span class="count num">${currentFiles.length}パーツ</span>`;
  }
  crumbs.innerHTML = html;
}

/* ---- 左：案件ツリー ---- */
async function loadTree() {
  sidebarStatus.textContent = "読み込み中...";
  try {
    const allProjects = await fetchProjectMachineTree();
    // 工事番号2000番台のみ表示（一時的な絞り込み）
    tree = allProjects.filter((project) => {
      const n = parseInt(project.num, 10);
      return !isNaN(n) && n >= 2000 && n <= 2999;
    });
    sidebarStatus.textContent = "";
    renderRecentMachines();
    renderSidebar();
    renderAll();
  } catch (err) {
    sidebarStatus.textContent = "読み込みエラー：" + err.message;
  }
}

sidebarSearchInput.addEventListener("input", () => {
  searchQuery = sidebarSearchInput.value.trim().toLowerCase();
  renderSidebar();
});

function renderSidebar() {
  sidebarList.innerHTML = "";
  const visibleProjects = searchQuery
    ? tree.filter((project) =>
        project.num.toLowerCase().includes(searchQuery) ||
        (project.customer || "").toLowerCase().includes(searchQuery))
    : tree;

  if (searchQuery && visibleProjects.length === 0) {
    const empty = document.createElement("div");
    empty.className = "sidebar-empty-msg";
    empty.textContent = "該当する案件が見つかりません";
    sidebarList.appendChild(empty);
  }

  visibleProjects.forEach((project) => {
    const isExpanded = expandedNums.has(project.num);
    const isSelectedProject = currentProject?.num === project.num;

    const projectDiv = document.createElement("div");
    projectDiv.className = "sidebar-project" + (isExpanded ? " expanded" : "");

    const item = document.createElement("div");
    item.className = "sidebar-item" + (isExpanded ? " expanded" : "") + (isSelectedProject && currentMachine ? " has-selection" : "");

    const chevron = document.createElement("span");
    chevron.className = "sidebar-item-chevron";
    chevron.innerHTML = ICON_CHEVRON;
    item.appendChild(chevron);

    const text = document.createElement("div");
    text.className = "sidebar-item-text";
    const num = document.createElement("span");
    num.className = "sidebar-item-num num";
    num.textContent = project.num;
    text.appendChild(num);
    if (project.customer) {
      const customer = document.createElement("span");
      customer.className = "sidebar-item-customer";
      customer.textContent = project.customer;
      text.appendChild(customer);
    }
    item.appendChild(text);

    const count = document.createElement("span");
    count.className = "sidebar-item-count num";
    count.textContent = project.machines.length;
    item.appendChild(count);

    item.onclick = () => toggleProject(project);
    projectDiv.appendChild(item);

    if (isExpanded) {
      const machinesDiv = document.createElement("div");
      machinesDiv.className = "sidebar-machines";
      if (project.machines.length === 0) {
        const empty = document.createElement("div");
        empty.className = "sidebar-machine-empty";
        empty.textContent = "機械名の登録がありません";
        machinesDiv.appendChild(empty);
      } else {
        project.machines.forEach((machineName) => {
          const isActive = isSelectedProject && currentMachine === machineName;
          const btn = document.createElement("button");
          btn.className = "sidebar-machine-btn" + (isActive ? " active" : "");
          btn.title = machineName;
          btn.innerHTML = `<span class="dot"></span><span class="mark">${ICON_CUBE}</span><span class="mname">${machineName}</span>`;
          btn.onclick = () => selectMachine(project, machineName);
          machinesDiv.appendChild(btn);
        });
      }
      projectDiv.appendChild(machinesDiv);
    }

    sidebarList.appendChild(projectDiv);
  });
}

function toggleProject(project) {
  if (expandedNums.has(project.num)) {
    expandedNums.delete(project.num);
    if (currentProject?.num === project.num) {
      currentProject = null;
      currentMachine = null;
      currentFiles = [];
      closePreview();
      renderAll();
    }
  } else {
    expandedNums.add(project.num);
  }
  renderSidebar();
}

function selectMachine(project, machineName) {
  currentProject = project;
  currentMachine = machineName;
  currentFiles = [];
  closePreview();
  saveRecentMachine(currentProject, machineName);
  renderSidebar();
  renderAll();
  loadMachineFiles();
}

function renderAll() {
  renderCrumbs();
  renderParts();
  renderInspector();
}

/* ---- 中：パーツ一覧 ---- */
async function loadMachineFiles() {
  if (!currentMachine) return;
  partsLoading = true;
  partsError = "";
  renderAll();
  try {
    const files = await fetchMachineFiles(currentProject, currentMachine);
    currentFiles = files;
  } catch (err) {
    partsError = "読み込みエラー：" + err.message;
  } finally {
    partsLoading = false;
    renderAll();
  }
}

function renderParts() {
  partsGrid.innerHTML = "";
  partsCountEl.textContent = currentMachine && !partsLoading ? `${currentFiles.length}件` : "";

  if (!currentMachine) {
    partsGrid.innerHTML = `<div class="parts-status">左の一覧から工事番号 → 機械名を選択してください</div>`;
    return;
  }
  if (partsLoading) {
    partsGrid.innerHTML = `<div class="parts-status">読み込み中...</div>`;
    return;
  }
  if (partsError) {
    partsGrid.innerHTML = `<div class="parts-status">${partsError}</div>`;
    return;
  }
  if (currentFiles.length === 0) {
    partsGrid.innerHTML = `<div class="parts-status">SharePoint上に3Dモデルがまだありません（命名規則を確認してください）</div>`;
  } else {
    currentFiles.forEach((file) => partsGrid.appendChild(buildPartCard(file)));
  }

  const tile = document.createElement("div");
  tile.className = "sp-link-tile";
  tile.id = "spLinkTile";
  tile.innerHTML = `${ICON_EXTERNAL}<span class="t1">SharePointで開く</span><span class="t2">アップロード・削除はこちらで</span>`;
  tile.onclick = openSharePointFolder;
  partsGrid.appendChild(tile);
}

function buildPartCard(file) {
  const id = String(file.id);
  const card = document.createElement("div");
  card.className = "part-card" + (String(currentFileId) === id ? " active" : "");
  card.draggable = true;
  card.dataset.fileId = id;
  card.style.cssText = "position:relative;display:block;flex:none;width:calc(50% - 5px);height:118px;overflow:hidden;cursor:grab";
  card.addEventListener("dragstart", () => card.classList.add("dragging"));
  card.addEventListener("dragend", () => card.classList.remove("dragging"));

  const thumbBtn = document.createElement("div");
  thumbBtn.className = "part-thumb-btn";
  thumbBtn.setAttribute("role", "button");
  thumbBtn.title = file.part_label || "";
  thumbBtn.style.cssText = "position:relative;display:block;width:100%;height:86px;overflow:hidden;cursor:pointer;background:var(--panel3);border-bottom:1px solid var(--line)";
  if (file.thumbnail_url) {
    const img = document.createElement("img");
    img.className = "part-thumb";
    img.src = file.thumbnail_url;
    img.alt = "";
    img.style.cssText = "display:block;width:100%;height:86px;object-fit:cover";
    thumbBtn.appendChild(img);
  } else {
    const placeholder = document.createElement("span");
    placeholder.className = "part-thumb-placeholder";
    placeholder.innerHTML = ICON_CUBE;
    placeholder.style.cssText = "display:flex;width:100%;height:86px;align-items:center;justify-content:center;color:var(--dim2)";
    thumbBtn.appendChild(placeholder);
  }
  thumbBtn.onclick = () => openPreview(file);
  card.appendChild(thumbBtn);

  const menuBtn = document.createElement("button");
  menuBtn.type = "button";
  menuBtn.className = "part-menu-btn";
  menuBtn.title = "編集";
  menuBtn.innerHTML = ICON_DOTS;

  const editInput = document.createElement("input");
  editInput.type = "file";
  editInput.accept = "image/*";
  editInput.style.display = "none";
  editInput.onchange = async () => {
    const chosen = editInput.files[0];
    if (!chosen) return;
    try {
      await updateThumbnail(file.id, chosen);
      await loadMachineFiles();
    } catch (err) {
      console.error(err);
      partsError = "サムネイルの更新に失敗しました：" + (err.message || err);
      renderParts();
    }
  };

  const editMenu = document.createElement("div");
  editMenu.className = "part-edit-menu";
  const closeEditMenu = () => editMenu.classList.remove("open");

  const thumbMenuItem = document.createElement("button");
  thumbMenuItem.type = "button";
  thumbMenuItem.textContent = "サムネイル画像を変更";
  thumbMenuItem.onclick = (e) => { e.stopPropagation(); closeEditMenu(); editInput.click(); };

  const nameMenuItem = document.createElement("button");
  nameMenuItem.type = "button";
  nameMenuItem.textContent = "ファイル名を編集";
  nameMenuItem.onclick = (e) => { e.stopPropagation(); closeEditMenu(); renamePart(file); };

  editMenu.appendChild(thumbMenuItem);
  editMenu.appendChild(nameMenuItem);

  menuBtn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll(".part-edit-menu.open").forEach((m) => { if (m !== editMenu) m.classList.remove("open"); });
    editMenu.classList.toggle("open");
  };

  card.appendChild(menuBtn);
  card.appendChild(editMenu);
  card.appendChild(editInput);

  const foot = document.createElement("div");
  foot.className = "part-foot";
  foot.style.cssText = "display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;background:var(--panel)";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.style.cssText = "font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
  lbl.textContent = file.part_label || "表示";
  lbl.title = file.part_label || "";
  foot.appendChild(lbl);
  const date = document.createElement("span");
  date.className = "date num";
  date.style.cssText = "margin-left:auto;font-size:10px;color:var(--dim2);flex-shrink:0";
  date.textContent = formatShortDate(file.lastModifiedDateTime);
  foot.appendChild(date);
  card.appendChild(foot);

  return card;
}

document.addEventListener("click", () => {
  document.querySelectorAll(".part-edit-menu.open").forEach((m) => m.classList.remove("open"));
});

async function renamePart(file) {
  const current = file.part_label || "";
  const next = prompt("ファイル名（パーツ番号）を入力してください", current);
  if (next === null) return;
  const trimmed = next.trim();
  if (trimmed === current) return;
  try {
    await updatePartLabel(file.id, trimmed);
    await loadMachineFiles();
  } catch (err) {
    console.error(err);
    partsError = "ファイル名の更新に失敗しました：" + (err.message || err);
    renderParts();
  }
}

$("openSharePointHeadBtn").onclick = openSharePointFolder;

// ユーザーの操作直後に空タブを同期的に開き、URL解決後にそこへ遷移させる（ポップアップブロック対策）
async function openSharePointFolder() {
  if (!currentProject || !currentMachine) return;
  const win = window.open("", "_blank");
  try {
    const url = await getMachineFolderWebUrl(currentProject.num, currentProject.customer, currentMachine);
    if (url) {
      win.location.href = url;
    } else {
      win.close();
      alert("SharePoint上にまだこのフォルダがありません。命名規則（工事番号_客先名／機械名）を確認してください。");
    }
  } catch (err) {
    console.error(err);
    win.close();
    alert("SharePointフォルダを開けませんでした：" + (err.message || err));
  }
}

/* ---- 並べ替え（グリッド） ---- */
function getGridDropTarget(container, x, y) {
  const cards = [...container.querySelectorAll(".part-card:not(.dragging)")];
  for (const c of cards) {
    const b = c.getBoundingClientRect();
    if (y < b.top) return c;
    if (y <= b.bottom && x < b.left + b.width / 2) return c;
  }
  return null;
}

function setupPartsDragAndDrop(container) {
  const indicator = document.createElement("div");
  indicator.className = "drop-indicator";

  container.addEventListener("dragover", (e) => {
    const dragging = container.querySelector(".part-card.dragging");
    if (!dragging) return;
    e.preventDefault();
    const target = getGridDropTarget(container, e.clientX, e.clientY);
    const tile = $("spLinkTile");
    if (target) container.insertBefore(indicator, target);
    else if (tile) container.insertBefore(indicator, tile);
    else container.appendChild(indicator);
  });
  container.addEventListener("dragleave", (e) => {
    if (!container.contains(e.relatedTarget)) indicator.remove();
  });
  container.addEventListener("dragend", () => indicator.remove());
  container.addEventListener("drop", async (e) => {
    const dragging = container.querySelector(".part-card.dragging");
    if (!dragging) return;
    e.preventDefault();
    container.insertBefore(dragging, indicator);
    indicator.remove();
    const orderedIds = [...container.querySelectorAll(".part-card")].map((c) => c.dataset.fileId);
    await applyOrder(orderedIds);
  });
}
setupPartsDragAndDrop(partsGrid);

async function applyOrder(orderedIds) {
  currentFiles = orderedIds
    .map((id) => currentFiles.find((f) => String(f.id) === String(id)))
    .filter(Boolean);
  renderAll();
  try {
    await reorderParts(orderedIds);
  } catch (err) {
    console.error(err);
    partsError = "並び順の保存に失敗しました：" + (err.message || err);
    renderParts();
  }
}

/* ---- 右端：インスペクター ---- */
function renderInspector() {
  const file = currentFiles.find((f) => String(f.id) === String(currentFileId));
  inspTitle.textContent = file ? (file.part_label || "表示") : "詳細";
  $("inspRenameBtn").disabled = !file;

  inspMeta.innerHTML = "";
  if (!file) {
    const empty = document.createElement("div");
    empty.className = "insp-empty";
    empty.textContent = currentMachine ? "パーツを選択すると詳細を表示します" : "機械名を選択してください";
    inspMeta.appendChild(empty);
  } else {
    const rows = [
      ["ファイル", file.name],
      ["更新日時", formatDateTime(file.lastModifiedDateTime)],
    ];
    rows.forEach(([k, v]) => {
      if (!v) return;
      const row = document.createElement("div");
      row.className = "insp-row";
      row.innerHTML = `<span class="k">${k}</span><span class="v num" title="${v}">${v}</span>`;
      inspMeta.appendChild(row);
    });
    const statusRow = document.createElement("div");
    statusRow.className = "insp-row";
    statusRow.innerHTML = `<span class="k">状態</span><span class="v ok"><span class="led"></span><span id="inspStatusText">${previewStatusText.textContent || "読み込み中"}</span></span>`;
    inspMeta.appendChild(statusRow);

    const thumbBtn = document.createElement("button");
    thumbBtn.className = "insp-wide-btn";
    thumbBtn.innerHTML = `${ICON_IMAGE}<span>サムネイルを変更</span>`;
    const thumbFileInput = document.createElement("input");
    thumbFileInput.type = "file";
    thumbFileInput.accept = "image/*";
    thumbFileInput.style.display = "none";
    thumbFileInput.onchange = async () => {
      const chosen = thumbFileInput.files[0];
      if (!chosen) return;
      try {
        await updateThumbnail(file.id, chosen);
        await loadMachineFiles();
      } catch (err) {
        console.error(err);
        partsError = "サムネイルの更新に失敗しました：" + (err.message || err);
        renderParts();
      }
    };
    thumbBtn.onclick = () => thumbFileInput.click();
    inspMeta.appendChild(thumbBtn);
    inspMeta.appendChild(thumbFileInput);
  }

  renderOrderList();
}

function renderOrderList() {
  inspOrderList.innerHTML = "";
  if (!currentMachine || currentFiles.length === 0) {
    const empty = document.createElement("div");
    empty.className = "insp-empty";
    empty.textContent = "パーツがありません";
    inspOrderList.appendChild(empty);
    return;
  }
  currentFiles.forEach((file, i) => {
    const id = String(file.id);
    const row = document.createElement("div");
    row.className = "insp-order-row" + (String(currentFileId) === id ? " active" : "");
    row.draggable = true;
    row.dataset.fileId = id;
    row.innerHTML = `<span class="grip">${ICON_GRIP}</span><span class="name">${file.part_label || "表示"}</span><span class="pos num">${i + 1}</span>`;
    row.addEventListener("dragstart", () => row.classList.add("dragging"));
    row.addEventListener("dragend", () => row.classList.remove("dragging"));
    row.onclick = () => openPreview(file);
    inspOrderList.appendChild(row);
  });
}

function setupOrderListDrag(container) {
  const indicator = document.createElement("div");
  indicator.className = "insp-order-ind";
  container.addEventListener("dragover", (e) => {
    const dragging = container.querySelector(".insp-order-row.dragging");
    if (!dragging) return;
    e.preventDefault();
    const rows = [...container.querySelectorAll(".insp-order-row:not(.dragging)")];
    const after = rows.find((r) => {
      const b = r.getBoundingClientRect();
      return e.clientY < b.top + b.height / 2;
    });
    if (after) container.insertBefore(indicator, after);
    else container.appendChild(indicator);
  });
  container.addEventListener("dragleave", (e) => {
    if (!container.contains(e.relatedTarget)) indicator.remove();
  });
  container.addEventListener("dragend", () => indicator.remove());
  container.addEventListener("drop", async (e) => {
    const dragging = container.querySelector(".insp-order-row.dragging");
    if (!dragging) return;
    e.preventDefault();
    container.insertBefore(dragging, indicator);
    indicator.remove();
    const orderedIds = [...container.querySelectorAll(".insp-order-row")].map((r) => r.dataset.fileId);
    await applyOrder(orderedIds);
  });
}
setupOrderListDrag(inspOrderList);

$("inspRenameBtn").onclick = () => {
  const file = currentFiles.find((f) => String(f.id) === String(currentFileId));
  if (file) renamePart(file);
};

/* ---- ビューア ---- */
const bgSwatchGroup = $("bgSwatchGroup");
[
  { key: "dark", label: "暗い背景", cls: "bg-swatch-dark", color: 0x1a1a1a },
  { key: "gray", label: "グレー背景", cls: "bg-swatch-gray", color: 0x6b7280 },
  { key: "light", label: "明るい背景", cls: "bg-swatch-light", color: 0xf2f2f2 },
].forEach((opt) => {
  const b = document.createElement("button");
  b.className = "bg-swatch-btn " + opt.cls + (opt.key === "dark" ? " active" : "");
  b.title = opt.label;
  b.onclick = () => {
    selectedBackground = opt.color;
    currentViewer?.setBackground(opt.color);
    bgSwatchGroup.querySelectorAll(".bg-swatch-btn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
  };
  bgSwatchGroup.appendChild(b);
});

$("resetViewBtn").onclick = () => currentViewer?.resetView();
$("fullscreenBtn").onclick = () => {
  const file = currentFiles.find((f) => String(f.id) === String(currentFileId));
  if (!currentUrl || !file) return;
  const params = new URLSearchParams({
    url: currentUrl,
    title: previewTitle.textContent || "",
    bg: "0x" + selectedBackground.toString(16).padStart(6, "0"),
    type: splatFileTypeFromFileName(file.name) || "",
  });
  window.open("viewer.html?" + params.toString(), "_blank");
};

function setViewerStatus(msg) {
  previewStatusText.textContent = msg;
  const done = /完了|表示|読み込みました/.test(msg);
  previewStatusEl.classList.toggle("done", done);
  previewStatusEl.classList.toggle("loading", !done);
  const inspStatus = $("inspStatusText");
  if (inspStatus) inspStatus.textContent = msg;
}

let hintTimer = null;
function openPreview(file) {
  currentViewer?.dispose();
  previewStage.querySelectorAll("canvas").forEach((c) => c.remove());

  currentFileId = String(file.id);
  currentUrl = file.downloadUrl;
  previewTitle.textContent = `${currentMachine}　${file.part_label || ""}`.trim();
  const idx = currentFiles.findIndex((f) => String(f.id) === currentFileId);
  previewIndex.textContent = idx >= 0 ? `${idx + 1} / ${currentFiles.length}` : "";
  previewPlaceholder.style.display = "none";
  previewStage.style.display = "block";

  viewerHint.style.opacity = "1";
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { viewerHint.style.opacity = "0"; }, 6000);

  setViewerStatus("読み込み中...");
  currentViewer = initViewer(previewStage, file.downloadUrl, {
    background: selectedBackground,
    fileType: splatFileTypeFromFileName(file.name),
    onStatus: (msg) => setViewerStatus(msg),
  });

  renderParts();
  renderInspector();
}

function closePreview() {
  currentViewer?.dispose();
  currentViewer = null;
  currentUrl = null;
  currentFileId = null;
  previewStage.style.display = "none";
  previewStage.querySelectorAll("canvas").forEach((c) => c.remove());
  previewPlaceholder.style.display = "flex";
}

renderAll();
loadTree();
</script>
